<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>うちゅうドライブ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0b0a2a;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: relative;
    width: 100vw; height: 100%;
    max-width: 640px;
    margin: 0 auto;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* かさなる がめん（スタート・おしまい） */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    color: #fff;
    padding: 24px;
    gap: 18px;
  }
  .hidden { display: none !important; }

  .title {
    font-size: clamp(30px, 10vw, 56px);
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 0 3px 0 #3b2ea0, 0 0 22px rgba(120,140,255,.7);
  }
  .sub { font-size: clamp(15px, 4.5vw, 20px); opacity: .95; line-height: 1.7; }

  .btn {
    font-family: inherit;
    font-size: clamp(22px, 6.5vw, 30px);
    font-weight: 800;
    color: #2a1a5e;
    background: linear-gradient(#ffe37a, #ffc93c);
    border: none;
    border-radius: 999px;
    padding: 16px 44px;
    box-shadow: 0 6px 0 #c9962a, 0 10px 22px rgba(0,0,0,.35);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9962a, 0 4px 10px rgba(0,0,0,.35); }
  .btn:disabled { opacity: .62; cursor: wait; transform: none; box-shadow: 0 4px 0 #c9962a, 0 7px 14px rgba(0,0,0,.22); }

  /* ステージえらび：星雲をたどる こうろ */
  .stage-screen { display:block; padding:0; background:linear-gradient(180deg, rgba(3,15,43,.60), rgba(3,15,43,.18) 36%, rgba(3,15,43,.58)); }
  .stage-screen .back-btn { position:absolute; z-index:5; top:20px; left:16px; }
  .map-heading { position:absolute; z-index:3; top:22px; left:0; right:0; text-align:center; text-shadow:0 2px 9px #06122e; }
  .map-heading .map-title { font-size:clamp(25px,7.5vw,39px); font-weight:800; letter-spacing:.12em; }
  .map-heading .map-sub { margin-top:4px; color:#c9ffff; font-size:clamp(12px,3.5vw,15px); font-weight:700; }
  .stage-panel { position:absolute; inset:98px 0 60px; overflow:hidden; }
  .map-route { position:absolute; inset:0; width:100%; height:100%; }
  .map-route .route-base { fill:none; stroke:rgba(116,237,255,.19); stroke-width:4.2; stroke-linecap:round; }
  .map-route .route-lit { fill:none; stroke:#7cf9ff; stroke-width:1.05; stroke-linecap:round; filter:drop-shadow(0 0 4px #48eaff); }
  .stage-pin { position:absolute; z-index:2; width:108px; margin-left:-54px; transform:translateY(-50%); border:0; background:transparent; color:#fff; font:inherit; text-align:center; cursor:pointer; }
  .stage-orb { display:grid; place-items:center; width:38px; height:38px; margin:auto; border:3px solid #a9ffff; border-radius:50%; background:radial-gradient(circle at 36% 28%,#fff 0 4%,#70f6fb 10%,#168aa8 39%,#293c8c 78%); box-shadow:0 0 0 5px rgba(62,230,255,.14),0 0 19px #45eaff; }
  .stage-pin .stage-name { display:block; margin-top:5px; padding:2px 5px; border-radius:999px; background:rgba(5,20,53,.34); font-size:12px; font-weight:800; line-height:1.2; text-shadow:0 2px 4px #06122e; white-space:nowrap; }
  .stage-pin.is-done .stage-orb { border-color:#ffe996; background:radial-gradient(circle at 36% 28%,#fffbd8 0 8%,#ffe06b 12%,#d89b27 47%,#6b4d91 82%); box-shadow:0 0 0 5px rgba(255,216,99,.13),0 0 16px #ffdf69; }
  .stage-pin.is-done .stage-orb::after { content:'✓'; color:#fff; font-size:23px; font-weight:900; text-shadow:0 1px 5px #785216; }
  .stage-pin.is-current { width:184px; margin-left:-92px; }
  .stage-pin.is-current .stage-orb { width:58px; height:58px; border-width:4px; box-shadow:0 0 0 8px rgba(84,239,255,.20),0 0 29px #48f5ff; animation:map-pulse 1.6s ease-in-out infinite; }
  .stage-pin.is-current .stage-name { margin-top:7px; padding:4px 8px; color:#06204b; background:#c6ffff; box-shadow:0 0 15px rgba(56,234,255,.85); font-size:12px; text-shadow:none; }
  .stage-pin.is-current .stage-name::before { content:'いま ここ！　'; font-size:10px; }
  .stage-pin.is-locked { cursor:default; opacity:.58; }
  .stage-pin.is-locked .stage-orb { width:31px; height:31px; border-color:rgba(183,208,255,.68); background:rgba(21,42,93,.68); box-shadow:0 0 10px rgba(132,168,255,.35); }
  .stage-pin.is-locked .stage-orb::after { content:'🔒'; font-size:13px; filter:grayscale(1) brightness(1.7); }
  .stage-pin:focus-visible { outline:3px solid #fff; outline-offset:4px; border-radius:50%; }
  .map-key { position:absolute; z-index:3; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:11px; width:max-content; max-width:calc(100% - 32px); padding:8px 12px; border:1px solid rgba(169,246,255,.27); border-radius:14px; background:rgba(4,19,53,.55); color:#e6fbff; font-size:11px; font-weight:700; backdrop-filter:blur(6px); }
  .map-key span { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }.map-key i { width:8px; height:8px; border-radius:50%; }.map-key .done-key{background:#ffd765}.map-key .current-key{background:#65f6ff}.map-key .locked-key{background:#7890bd}
  @keyframes map-pulse { 50% { transform:scale(1.08); filter:brightness(1.16); } }
  @media (prefers-reduced-motion:reduce) { .stage-pin.is-current .stage-orb { animation:none; } }
  .back-btn { border: 0; background: transparent; color:#fff; font:inherit; font-size:16px; font-weight:700; text-decoration:underline; cursor:pointer; }

  .stars { font-size: clamp(40px, 13vw, 72px); letter-spacing: 8px; line-height: 1; }
  .praise { font-size: clamp(22px, 6.5vw, 32px); font-weight: 800; text-shadow: 0 2px 0 #3b2ea0; }
  .result { font-size: clamp(15px, 4.5vw, 19px); opacity: .95; }

  /* あそびかた の ちいさな ふきだし */
  .hint {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    color: #fff; font-size: clamp(14px, 4vw, 18px); font-weight: 700;
    background: rgba(20,18,60,.55); padding: 8px 18px; border-radius: 999px;
    white-space: nowrap;
    animation: bob 1.1s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{ transform: translateX(-50%) translateY(0);} 50%{ transform: translateX(-50%) translateY(-5px);} }

  /* うえの じょうほう（ほしの かず） */
  #hud {
    position: absolute; top: 12px; right: 14px;
    color: #fff; font-size: clamp(18px, 5vw, 24px); font-weight: 800;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  #hud.hidden { display: none; }
  #stageLabel { margin-right: 8px; font-size: .68em; opacity: .9; }
</style>

<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden"><span id="stageLabel"></span>⭐ <span id="starcount">0</span></div>
  <div id="hint" class="hint hidden">タップで 2だんジャンプ！</div>

  <!-- スタートがめん -->
  <div id="startScreen" class="screen">
    <a id="portal-link" href="https://tkzlab.github.io/game-portal/">🏠 ぽーたるへ</a>
    <style>
    #portal-link{position:absolute;top:10px;left:10px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#555;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.18);}
    #portal-link:hover{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.28);}
    </style>
    <div class="title">うちゅうドライブ</div>
    <div class="sub">タップで ジャンプして<br>ほしを あつめよう！</div>
    <button id="startBtn" class="btn" disabled>よみこみちゅう…</button>
  </div>

  <!-- ステージえらび -->
  <div id="stageScreen" class="screen stage-screen hidden">
    <div class="map-heading"><div class="map-title">ほしの こうろ</div><div class="map-sub">つぎの ドッキングポイントへ</div></div>
    <div id="stagePanel" class="stage-panel"></div>
    <div class="map-key"><span><i class="done-key"></i>とうちゃく</span><span><i class="current-key"></i>つぎの ばしょ</span><span><i class="locked-key"></i>そのさき</span></div>
    <button id="backBtn" class="back-btn">もどる</button>
  </div>

  <!-- おしまいがめん -->
  <div id="endScreen" class="screen hidden">
    <div class="praise" id="praise">とうちゃく！</div>
    <div class="stars" id="starRating">⭐⭐⭐</div>
    <div class="result" id="resultText">ほしを あつめたよ</div>
    <button id="nextBtn" class="btn">つぎの ステージ</button>
    <button id="stagesBtn" class="back-btn">ステージを えらぶ</button>
    <button id="endBtn" class="back-btn">おわる</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var wrap = document.getElementById("wrap");

  var startScreen = document.getElementById("startScreen");
  var stageScreen = document.getElementById("stageScreen");
  var endScreen = document.getElementById("endScreen");
  var hud = document.getElementById("hud");
  var hint = document.getElementById("hint");
  var starCountEl = document.getElementById("starcount");
  var starRatingEl = document.getElementById("starRating");
  var praiseEl = document.getElementById("praise");
  var resultTextEl = document.getElementById("resultText");
  var stageLabelEl = document.getElementById("stageLabel");
  var stagePanel = document.getElementById("stagePanel");
  var startBtn = document.getElementById("startBtn");

  // ---- びょうがサイズ（Retina たいおう）----
  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeLayout();
  }
  window.addEventListener("resize", resize);

  // ---- レイアウト（がめんサイズから けいさん）----
  var groundY, vehX, vehW, vehH, jumpV, gravity;
  function computeLayout() {
    groundY = H * 0.80;                 // じめんの たかさ
    vehW = Math.max(46, Math.min(72, W * 0.16));
    vehH = vehW * 0.72;
    vehX = W * 0.22;                    // のりものの よこいち（こてい）
    // ジャンプ：やく 0.62びょうで さいこうてんへ、ゆったり
    gravity = H * 2.4;                  // px/s^2
    jumpV = -Math.sqrt(2 * gravity * (H * 0.30)); // さいだい たかさ ≒ がめんの30%
  }

  // ---- ゲームじょうたい ----
  var state = "start"; // start | stages | play | end
  var worldX = 0;      // すすんだ きょり（px）
  var goalX = 0;       // ゴールまでの きょり
  var speed = 0;       // px/s（よこスクロール）
  var vehY = 0;        // じめんからの たかさ（px, +でうえ）
  var vehVy = 0;
  var onGround = true;
  var jumpsUsed = 0;   // ちゃくちするまでの ジャンプかいすう（2かいまで）
  var stumbleT = 0;    // つまづき ざんり じかん
  var obstacles = [];  // {x, w, h, type, hit}
  var stars = [];      // {x, y, got}
  var totalStars = 0;
  var gotStars = 0;
  var goalReached = false;
  var arriveT = 0;     // ゴールえんしゅつ じかん
  var tilt = 0;        // のりものの かたむき（つまづき えんしゅつ）
  var bgStars = [];    // せかいの ほしぞら（そうしょく）
  var currentStage = 0;
  var stageProgress = { highestUnlocked: 0, completed: [] };
  var stationImage = new Image();
  stationImage.src = "assets/docking-station.png";
  var roverImage = new Image();
  roverImage.src = "assets/moon-rover.png";
  var planetImage = new Image();
  planetImage.src = "assets/ringed-planet.png";
  var obstacleSheet = new Image();
  obstacleSheet.src = "assets/obstacles-sheet.png";
  var stageBackground = new Image();
  stageBackground.src = "assets/moon-stage-background.png";
  var collectibleStarImage = new Image();
  collectibleStarImage.src = "assets/collectible-star.png";
  var imageAssets = [stationImage, roverImage, planetImage, obstacleSheet, stageBackground, collectibleStarImage];
  var assetsReady = false;
  var assetsFailed = false;

  // あたらしい えを ぜんぶ よみこんでから はじめる。よみこみ中に ふるい代替えが出ないようにする
  function prepareAssets() {
    var remaining = imageAssets.length;
    function finish() {
      remaining--;
      if (remaining === 0 && !assetsFailed) {
        assetsReady = true;
        startBtn.disabled = false;
        startBtn.textContent = "ステージを えらぶ";
      }
    }
    function failed() {
      if (assetsFailed) return;
      assetsFailed = true;
      startBtn.textContent = "よみこみ できなかったよ";
    }
    imageAssets.forEach(function (image) {
      if (image.complete) {
        if (image.naturalWidth) finish(); else failed();
      } else {
        image.addEventListener("load", finish, { once: true });
        image.addEventListener("error", failed, { once: true });
      }
    });
  }

  // すべてのコースは同じジャンプで遊べるよう、障害物の間隔を画面幅の倍率で定義する
  var stageDefs = [
    { name: "はじめての つき", note: "ゆっくり ジャンプ", speed: 0.39, sky: ["#041a34", "#0b3d66", "#325478"], planet: ["#36d7df", "#abf7ff"], course: [
      ["rock", .08, .98, 1], ["crystal", .09, 1.10, 2], ["rock", .07, 1.05, 1], ["crystal", .09, 1.16, 2], ["rock", .08, 1.10, 1]
    ]},
    { name: "きらきら すいしょう", note: "ほしを たくさん", speed: 0.42, sky: ["#03172f", "#0a506e", "#277584"], planet: ["#45e9d2", "#cdffff"], course: [
      ["crystal", .10, .90, 2], ["crystal", .12, .94, 2], ["rock", .08, 1.04, 2], ["crystal", .10, .92, 2], ["rock", .08, 1.06, 1], ["crystal", .12, .98, 2]
    ]},
    { name: "いんせき ロード", note: "リズムよく ぴょん", speed: 0.45, sky: ["#06132e", "#16476c", "#3b577c"], planet: ["#718fff", "#d0eaff"], course: [
      ["rock", .09, .82, 1], ["rock", .08, .87, 2], ["crystal", .10, 1.01, 1], ["rock", .11, .90, 2], ["rock", .08, .88, 1], ["crystal", .11, 1.02, 2], ["rock", .09, .94, 1]
    ]},
    { name: "わくせいリング", note: "ながい うちゅうのたび", speed: 0.47, sky: ["#06162f", "#204f79", "#4b5585"], planet: ["#a488ff", "#f0c8ff"], course: [
      ["crystal", .10, .84, 2], ["rock", .09, .91, 1], ["crystal", .12, .96, 2], ["rock", .10, .86, 2], ["crystal", .09, .98, 1], ["rock", .11, .89, 2], ["crystal", .11, .98, 2], ["rock", .09, 1.02, 1]
    ]},
    { name: "ステーション とうちゃく", note: "さいごの ぼうけん", speed: 0.48, sky: ["#03162d", "#125276", "#375c82"], planet: ["#74e5ff", "#e1ffff"], course: [
      ["rock", .09, .84, 1], ["crystal", .11, .88, 2], ["rock", .10, .92, 2], ["crystal", .12, .93, 1], ["rock", .09, .86, 2], ["crystal", .10, .97, 2], ["rock", .11, .88, 1], ["crystal", .11, .96, 2], ["rock", .09, 1.04, 1]
    ]}
  ];

  // つぎの ばしょを ひらく きろく。おなじ たんまつでは、つづきから たびを できる。
  function loadStageProgress() {
    try {
      var saved = JSON.parse(localStorage.getItem("spaceJumpProgressV1"));
      if (!saved || !Array.isArray(saved.completed)) return;
      stageProgress.highestUnlocked = Math.max(0, Math.min(stageDefs.length - 1, Number(saved.highestUnlocked) || 0));
      stageProgress.completed = saved.completed.filter(function (index) { return Number.isInteger(index) && index >= 0 && index < stageDefs.length; });
    } catch (e) {}
  }

  function saveStageProgress() {
    try { localStorage.setItem("spaceJumpProgressV1", JSON.stringify(stageProgress)); } catch (e) {}
  }

  function completeStage(index) {
    if (stageProgress.completed.indexOf(index) === -1) stageProgress.completed.push(index);
    if (index < stageDefs.length - 1) stageProgress.highestUnlocked = Math.max(stageProgress.highestUnlocked, index + 1);
    saveStageProgress();
  }

  // コース作成時の取り違えを早く見つけるための安全チェック
  function validateStageDefs() {
    stageDefs.forEach(function (stage) {
      if (!stage.name || !stage.course.length) throw new Error("ステージの設定がありません");
      stage.course.forEach(function (piece) {
        var isKnown = piece[0] === "rock" || piece[0] === "crystal";
        if (!isKnown || piece[1] > 0.12 || piece[1] < 0.06 || piece[2] < 0.82 || piece[3] < 1 || piece[3] > 2) {
          throw new Error("ステージのジャンプ設定が安全範囲外です");
        }
      });
    });
  }

  // ステージごとの けっていろんてき レベル（ほしのかずが きまる＝こうへいな ひょうか）
  function buildLevel() {
    obstacles = [];
    stars = [];
    var def = stageDefs[currentStage];
    var x = W * 1.12;                // さいしょは すこし あけて
    var seed = 12345 + currentStage * 997;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    // ほしの たかさ：ジャンプの アーチが かならず とおる バンド（とれる たかさ）
    var starLow = groundY - H * 0.20;
    var starHigh = groundY - H * 0.26;
    for (var i = 0; i < def.course.length; i++) {
      var piece = def.course[i];
      var type = piece[0];
      var h = piece[1] * H;
      var w = vehW * (type === "rock" ? 0.9 : 0.55);
      obstacles.push({ x: x, w: w, h: h, type: type, hit: false });
      var gap = W * piece[2];
      // しょうがいぶつを こえた すぐ さきに ほし（ジャンプの アーチで とれる）
      stars.push({ x: x + w * 0.5 + gap * 0.14, y: starHigh, got: false });
      if (piece[3] === 2) {
        stars.push({ x: x + w * 0.5 + gap * 0.55, y: starLow, got: false });
      }
      x += gap;
    }
    goalX = x + W * 0.5;
    totalStars = stars.length;
    gotStars = 0;

    // そうしょくの ほしぞら
    bgStars = [];
    for (var s = 0; s < 60; s++) {
      bgStars.push({ x: rnd() * W, y: rnd() * groundY, r: rnd() * 1.6 + 0.4, tw: rnd() * 6.28 });
    }
  }

  function startGame(stageIndex) {
    if (!assetsReady) return;
    if (stageIndex > stageProgress.highestUnlocked) return;
    currentStage = stageIndex;
    computeLayout();
    buildLevel();
    worldX = 0;
    speed = W * stageDefs[currentStage].speed;
    vehY = 0; vehVy = 0; onGround = true; jumpsUsed = 0;
    stumbleT = 0; tilt = 0;
    goalReached = false; arriveT = 0;
    state = "play";
    startScreen.classList.add("hidden");
    stageScreen.classList.add("hidden");
    endScreen.classList.add("hidden");
    hud.classList.remove("hidden");
    starCountEl.textContent = "0";
    stageLabelEl.textContent = "ステージ " + (currentStage + 1);
    hint.classList.remove("hidden");
    setTimeout(function () { hint.classList.add("hidden"); }, 2600);
  }

  function showStages() {
    if (!assetsReady) return;
    state = "stages";
    startScreen.classList.add("hidden");
    endScreen.classList.add("hidden");
    stageScreen.classList.remove("hidden");
    hud.classList.add("hidden");
    hint.classList.add("hidden");
    renderStageMap();
  }

  function showStart() {
    state = "start";
    stageScreen.classList.add("hidden");
    endScreen.classList.add("hidden");
    hud.classList.add("hidden");
    hint.classList.add("hidden");
    startScreen.classList.remove("hidden");
  }

  function goNextStage() {
    startGame(currentStage < stageDefs.length - 1 ? currentStage + 1 : 0);
  }

  function buildStageButtons() {
    renderStageMap();
  }

  function renderStageMap() {
    var pinPositions = [
      { x: 70, y: 85 }, { x: 37, y: 65 }, { x: 63, y: 48 }, { x: 35, y: 30 }, { x: 64, y: 14 }
    ];
    var progressPaths = ["", "M70 85 C70 75 37 76 37 65", "M70 85 C70 75 37 76 37 65 C37 56 63 57 63 48", "M70 85 C70 75 37 76 37 65 C37 56 63 57 63 48 C63 39 35 40 35 30", "M70 85 C70 75 37 76 37 65 C37 56 63 57 63 48 C63 39 35 40 35 30 C35 21 64 22 64 14"];
    stagePanel.innerHTML = '<svg class="map-route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="route-base" d="M70 85 C70 75 37 76 37 65 C37 56 63 57 63 48 C63 39 35 40 35 30 C35 21 64 22 64 14"/><path class="route-lit" d="' + progressPaths[stageProgress.highestUnlocked] + '"/></svg>';
    stageDefs.forEach(function (stage, index) {
      var button = document.createElement("button");
      var isDone = stageProgress.completed.indexOf(index) !== -1;
      var isCurrent = !isDone && index === stageProgress.highestUnlocked;
      var isUnlocked = index <= stageProgress.highestUnlocked;
      button.className = "stage-pin" + (isDone ? " is-done" : isCurrent ? " is-current" : " is-locked");
      button.style.left = pinPositions[index].x + "%";
      button.style.top = pinPositions[index].y + "%";
      button.disabled = !isUnlocked;
      button.setAttribute("aria-label", "ステージ " + (index + 1) + "　" + stage.name + (isDone ? "　とうちゃく" : isCurrent ? "　つぎの ばしょ" : "　まだ いけない"));
      button.innerHTML = '<span class="stage-orb"></span><span class="stage-name">' + stage.name + '</span>';
      button.addEventListener("click", function () { startGame(index); });
      stagePanel.appendChild(button);
    });
  }

  function endGame() {
    state = "end";
    hud.classList.add("hidden");
    hint.classList.add("hidden");
    completeStage(currentStage);
    // こうへいな ひょうか：あつめた ほし ÷ でた ほし
    var ratio = totalStars > 0 ? gotStars / totalStars : 1;
    var rating, praise;
    if (ratio >= 0.8) { rating = 3; praise = "だいせいこう！"; }
    else if (ratio >= 0.4) { rating = 2; praise = "とっても じょうず！"; }
    else { rating = 1; praise = "うちゅうに とうちゃく！"; }
    var full = "⭐⭐⭐".slice(0, rating);
    var empty = "☆☆☆".slice(0, 3 - rating);
    starRatingEl.textContent = full + empty;
    praiseEl.textContent = praise;
    resultTextEl.textContent = "ほしを " + gotStars + "こ あつめたよ！　よく がんばったね";
    document.getElementById("nextBtn").textContent = currentStage < stageDefs.length - 1 ? "つぎの ステージ" : "さいしょの ステージへ";
    endScreen.classList.remove("hidden");
    beep(660, 0.12, 0.0); beep(880, 0.14, 0.12); beep(1180, 0.18, 0.26);
  }

  // ---- おと（Web Audio, そとぶファイル ふよう）----
  var actx = null;
  function beep(freq, dur, delay) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  // ---- そうさ：タップで ジャンプ ----
  function jump() {
    if (state !== "play") return;
    if (jumpsUsed >= 2) return;
    vehVy = jumpV;
    onGround = false;
    jumpsUsed++;
    beep(jumpsUsed === 1 ? 520 : 700, 0.10, 0);
  }
  wrap.addEventListener("pointerdown", function (e) {
    // ボタンの タップは のぞく
    if (e.target.closest && e.target.closest(".btn")) return;
    jump();
  });

  document.getElementById("startBtn").addEventListener("click", showStages);
  document.getElementById("backBtn").addEventListener("click", showStart);
  document.getElementById("nextBtn").addEventListener("click", goNextStage);
  document.getElementById("stagesBtn").addEventListener("click", showStages);
  document.getElementById("endBtn").addEventListener("click", showStart);

  // ---- こうしん ----
  function update(dt) {
    if (state !== "play") return;

    var curSpeed = speed * (stumbleT > 0 ? 0.45 : 1);
    worldX += curSpeed * dt;

    // ジャンプ ぶつり
    vehVy += gravity * dt;
    vehY -= vehVy * dt;
    if (vehY <= 0) {
      vehY = 0; vehVy = 0; onGround = true;
      jumpsUsed = 0;
    }

    if (stumbleT > 0) { stumbleT -= dt; tilt = Math.sin(performance.now() * 0.03) * 0.18; }
    else { tilt *= 0.8; }

    // のりものの あたりはんてい ボックス（ゆるめ）
    var vLeft = vehX - vehW * 0.32;
    var vRight = vehX + vehW * 0.32;
    var vBottom = groundY - vehY;         // した
    var vTop = vBottom - vehH * 0.9;      // うえ

    // しょうがいぶつ
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      var ox = o.x - worldX;
      if (ox + o.w < -50) continue;
      if (ox > W + 50) break;
      if (!o.hit) {
        var oLeft = ox + o.w * 0.18, oRight = ox + o.w * 0.82;
        var oTop = groundY - o.h * 0.72;   // あたり はんてい ゆるめ
        if (vRight > oLeft && vLeft < oRight && vBottom > oTop) {
          o.hit = true;
          stumbleT = 0.5;
          beep(180, 0.16, 0);
        }
      }
    }

    // ほし
    for (var j = 0; j < stars.length; j++) {
      var s = stars[j];
      if (s.got) continue;
      var sx = s.x - worldX;
      if (sx < -40) continue;
      if (sx > W + 40) break;
      var dx = sx - vehX;
      var dy = s.y - (groundY - vehY - vehH * 0.5);
      var rr = vehW * 1.0;
      if (dx * dx + dy * dy < rr * rr) {
        s.got = true; gotStars++;
        starCountEl.textContent = String(gotStars);
        beep(1040, 0.10, 0);
      }
    }

    // ゴール はんてい
    if (!goalReached && worldX >= goalX) {
      goalReached = true;
    }
    if (goalReached) {
      arriveT += dt;
      if (arriveT > 0.9) { endGame(); }
    }
  }

  // ---- びょうが ----
  function draw() {
    if (!assetsReady) {
      ctx.fillStyle = "#071b38";
      ctx.fillRect(0, 0, W, H);
      return;
    }
    // そら（幻想的な あおみどりの つきの よる）
    var stage = stageDefs[currentStage];
    if (stageBackground.complete && stageBackground.naturalWidth) {
      var sourceRatio = stageBackground.naturalWidth / stageBackground.naturalHeight;
      var targetRatio = W / H;
      var sw, sh, sx, sy;
      if (sourceRatio > targetRatio) {
        sh = stageBackground.naturalHeight; sw = sh * targetRatio;
        sx = (stageBackground.naturalWidth - sw) * 0.5; sy = 0;
      } else {
        sw = stageBackground.naturalWidth; sh = sw / targetRatio;
        sx = 0; sy = (stageBackground.naturalHeight - sh) * 0.22;
      }
      ctx.drawImage(stageBackground, sx, sy, sw, sh, 0, 0, W, H);
      ctx.fillStyle = "rgba(3,17,43,.16)";
      ctx.fillRect(0, 0, W, H);
    } else {
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, stage.sky[0]);
      g.addColorStop(0.6, stage.sky[1]);
      g.addColorStop(1, stage.sky[2]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // ほしぞら（そうしょく・きらきら）
    var now = performance.now() * 0.004;
    for (var b = 0; b < bgStars.length; b++) {
      var st = bgStars[b];
      var a = 0.5 + 0.5 * Math.sin(now + st.tw);
      ctx.globalAlpha = 0.3 + a * 0.6;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc((st.x - worldX * 0.15) % W < 0 ? ((st.x - worldX * 0.15) % W) + W : (st.x - worldX * 0.15) % W, st.y, st.r, 0, 6.28);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // とおくの わくせい（そうしょく）
    // じめん
    var gg = ctx.createLinearGradient(0, groundY, 0, H);
    gg.addColorStop(0, "rgba(7,25,55,.92)");
    gg.addColorStop(0.18, "rgba(12,43,77,.94)");
    gg.addColorStop(1, "rgba(5,20,48,.98)");
    ctx.fillStyle = gg;
    ctx.fillRect(0, groundY, W, H - groundY);
    // はしる みちの ひかる ふち
    ctx.strokeStyle = "rgba(103,248,255,.9)";
    ctx.shadowColor = "#45eaff"; ctx.shadowBlur = 12;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.shadowBlur = 0;
    // みちを ゆっくり ながれる ひかり。位置は せかいの すすみぐあい と そろえる
    for (var d = 0; d < 7; d++) {
      var streakW = W * (0.10 + (d % 3) * 0.035);
      var px = (d * W * 0.27 - worldX * 0.34) % (W * 1.45);
      if (px < -streakW) px += W * 1.45;
      var py = groundY + (H - groundY) * (0.20 + (d % 3) * 0.23);
      var shine = ctx.createLinearGradient(px, py, px + streakW, py);
      shine.addColorStop(0, "rgba(102,245,255,0)");
      shine.addColorStop(0.45, "rgba(102,245,255,.20)");
      shine.addColorStop(0.55, "rgba(174,255,255,.28)");
      shine.addColorStop(1, "rgba(102,245,255,0)");
      ctx.fillStyle = shine;
      ctx.fillRect(px, py, streakW, 2);
    }

    // ゴール（うちゅうステーション）
    var goalScreenX = goalX - worldX;
    if (goalScreenX < W + 180) {
      drawGoal(goalScreenX, groundY);
    }

    // しょうがいぶつ
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      var ox = o.x - worldX;
      if (ox + o.w < -60 || ox > W + 60) continue;
      if (o.type === "rock") drawRock(ox, groundY, o.w, o.h);
      else drawCrystal(ox, groundY, o.w, o.h);
    }

    // ほし
    for (var j = 0; j < stars.length; j++) {
      var s = stars[j];
      if (s.got) continue;
      var sx = s.x - worldX;
      if (sx < -40 || sx > W + 40) continue;
      var fl = 0.85 + 0.15 * Math.sin(now * 2 + j);
      drawStar(sx, s.y + Math.sin(now + j) * 4, vehW * 0.45 * fl);
    }

    // のりもの
    drawVehicle(vehX, groundY - vehY, vehW, vehH, tilt);

    // ゴール えんしゅつ（きらり）：とうちゃくの あいだだけ ひからせ、end がめんは くらい うちゅうに もどす
    if (goalReached && state === "play") {
      ctx.globalAlpha = Math.min(0.55, arriveT * 0.7);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  function drawRock(x, gy, w, h) {
    ctx.drawImage(obstacleSheet, 0, 120, 820, 767, x - w * 0.30, gy - h * 1.10, w * 1.6, h * 1.25);
  }

  function drawCrystal(x, gy, w, h) {
    ctx.drawImage(obstacleSheet, 920, 0, 854, 887, x - w * 0.65, gy - h * 1.20, w * 2.2, h * 1.35);
  }

  function drawGoal(x, gy) {
    ctx.save();
    var w = Math.min(W * 0.55, H * 0.36);
    var h = w * 1.103;
    var pulse = 0.96 + Math.sin(performance.now() * 0.006) * 0.04;
    ctx.globalAlpha = 0.24;
    ctx.fillStyle = "#8ff7ff";
    ctx.beginPath(); ctx.ellipse(x, gy - h * 0.43, w * 0.48 * pulse, h * 0.43 * pulse, 0, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.drawImage(stationImage, x - w / 2, gy - h, w, h);
    ctx.restore();
  }

  function drawStar(cx, cy, r) {
    ctx.save();
    ctx.translate(cx, cy);
    var w = r * 2.45;
    var h = w * (collectibleStarImage.naturalHeight / collectibleStarImage.naturalWidth);
    ctx.drawImage(collectibleStarImage, -w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawVehicle(x, baseY, w, h, tl) {
    ctx.save();
    ctx.translate(x, baseY);
    ctx.rotate(tl);
    ctx.drawImage(roverImage, -w * 0.80, -h * 1.58, w * 1.60, h * 1.58);
    ctx.restore();
  }

  // ---- ループ ----
  var last = 0;
  function frame(t) {
    if (!last) last = t;
    var dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  prepareAssets();
  validateStageDefs();
  loadStageProgress();
  buildStageButtons();
  buildLevel();   // スタートがめんの はいけい（ほしぞら）ように いちど つくる。ゴールは とおくで えがかれない
  requestAnimationFrame(frame);
})();
</script>
